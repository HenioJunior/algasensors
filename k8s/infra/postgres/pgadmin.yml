apiVersion: v1
kind: Secret
metadata:
  name: pgadmin-secret
  namespace: algasensors
type: Opaque
stringData:
  PGADMIN_DEFAULT_EMAIL: admin@admin.com
  PGADMIN_DEFAULT_PASSWORD: admin123

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: algasensors

spec:
  replicas: 1

  selector:
    matchLabels:
      app: pgadmin

  template:
    metadata:
      labels:
        app: pgadmin

    spec:
      containers:
        - name: pgadmin

          image: dpage/pgadmin4:latest

          ports:
            - containerPort: 80

          envFrom:
            - secretRef:
                name: pgadmin-secret

---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: algasensors

spec:
  type: NodePort

  selector:
    app: pgadmin

  ports:
    - port: 80
      targetPort: 80
      nodePort: 30090