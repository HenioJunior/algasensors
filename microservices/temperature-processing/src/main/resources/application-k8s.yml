spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/temperature_processing
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  kafka:
    bootstrap-servers: broker:29092

    consumer:
      group-id: temperature-processing
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: "com.algasensors.*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.algasensors.temperature.processing.infra.messaging.dto.TemperatureMessage

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  kafka:
    topics:
      raw-reading: sensor.temperature.raw.v1
      processed-reading: sensor.temperature.processed.v1