server:
  port: 8100

spring:
  application:
    name: gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        - id: device-management
          uri: lb://DEVICE-MANAGEMENT
          predicates:
            - Path=/api/device-management/**

        - id: temperature-monitoring
          uri: lb://TEMPERATURE-MONITORING
          predicates:
            - Path=/api/temperature-monitoring/**

        - id: sensor-simulator
          uri: lb://SENSOR-SIMULATOR
          predicates:
            - Path=/api/sensor-simulator/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true
