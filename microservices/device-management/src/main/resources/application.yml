server:
  port: 8081

spring:
  application:
    name: device-management
  profiles:
    active: dev

app:
  sensor:
    url: http://localhost:8082
  temperature:
    monitoring:
      url: http://localhost:8083

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
